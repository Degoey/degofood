<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DEGOFOOD Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-orange-500 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between flex-wrap gap-3">
            <a href="/" class="text-white text-2xl font-bold">🍔 DEGOFOOD Admin</a>
            <div class="flex items-center gap-2">
                <a href="/" class="px-4 py-2 rounded-lg text-white text-sm font-semibold {% if active == 'dashboard' %}bg-orange-700{% else %}hover:bg-orange-600{% endif %}">Dashboard</a>
                <a href="/orders" class="px-4 py-2 rounded-lg text-white text-sm font-semibold {% if active == 'orders' %}bg-orange-700{% else %}hover:bg-orange-600{% endif %}">Pesanan</a>
                <a href="/restaurants" class="px-4 py-2 rounded-lg text-white text-sm font-semibold {% if active == 'restaurants' %}bg-orange-700{% else %}hover:bg-orange-600{% endif %}">Restoran</a>
                {% if active != 'login' %}
                <a href="/logout" class="px-4 py-2 rounded-lg text-white text-sm font-semibold hover:bg-orange-600">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
